<!doctype html>
<html lang="ar" dir="rtl" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<title>غلاف ترجمان</title>
<link rel="stylesheet" href="{{ROOT}}/src/ui/tokens.css">
<link rel="stylesheet" href="{{ROOT}}/src/ui/fonts.css">
<style>
  /* شعار README بالوضعين (لوحة الهوية 18، 1200×300، يُرسم بمعامل 2): الرمز 128 بنقطتي طين، والاسم Cairo 800، وسطر الرسالة،
     وشارتا Manifest V3 والإصدار في الطرف الآخر. والشارة «MIT» في اللوحة لا تُرسم: ترجمان «جميع الحقوق محفوظة» (LICENSE). */
  html, body { margin: 0; width: 1200px; height: 300px; overflow: hidden; }
  body { background: var(--tj-bg); color: var(--tj-text); font-family: var(--tj-font-body); -webkit-font-smoothing: antialiased; position: relative; }
  .tj-mark { position: absolute; right: 72px; top: 68px; color: var(--tj-logo-glyph); }
  .tj-mark__book { fill: currentColor; }
  .tj-mark__dots { fill: var(--tj-logo-dots-accent); }
  .copy { position: absolute; right: 240px; top: 72px; display: flex; flex-direction: column; gap: 8px; }
  .copy b { font: 800 60px/76px var(--tj-font-head); color: var(--tj-logo-word); }
  .copy span { font: 400 28px/44px var(--tj-font-body); color: var(--tj-text-2); }
  .tm { direction: ltr; unicode-bidi: isolate; }
  .badges { position: absolute; left: 48px; bottom: 40px; display: flex; gap: 12px; direction: ltr; }
  .badge { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 6px; background: var(--tj-surface-2); color: var(--tj-text-2); font: 700 24px/36px var(--tj-font-body); }
</style>
</head>
<body>
  {{MARK:128}}
  <div class="copy">
    <b>ترجمان</b>
    <span>ترجمتك فوق الفيديو — من أي لغة إلى لغتك · <bdi class="tm">for YouTube™</bdi></span>
  </div>
  <div class="badges"><span class="badge">Manifest V3</span><span class="badge">v{{VERSION}}</span></div>
</body>
</html>
