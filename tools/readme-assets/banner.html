<!doctype html>
<html lang="ar" dir="rtl" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<title>غلاف ترجمان</title>
<link rel="stylesheet" href="{{ROOT}}/src/ui/tokens.css">
<link rel="stylesheet" href="{{ROOT}}/src/ui/fonts.css">
<style>
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; }
  body {
    background: var(--tj-bg); color: var(--tj-text);
    font-family: var(--tj-font-body); -webkit-font-smoothing: antialiased;
  }
  .wrap { box-sizing: border-box; height: 100%; padding: 0 64px; display: flex; align-items: center; gap: 56px; }
  .copy { flex: 1 1 0; min-width: 0; }
  .tj-logo { display: block; }
  .tj-logo__glyph { fill: var(--tj-logo-glyph); }
  .tj-logo__word { fill: var(--tj-logo-word); }
  h1 { font-family: var(--tj-font-head); font-weight: 700; font-size: 38px; line-height: 1.3; margin: 24px 0 10px; }
  p { font-size: 19px; line-height: 1.75; color: var(--tj-text-2); margin: 0 0 24px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 14px; font-weight: 700; line-height: 1; padding: 9px 14px; border-radius: 999px;
    background: var(--tj-control); color: var(--tj-text-2);
  }
  .chip--local { background: var(--tj-selected); color: var(--tj-selected-ink); }
  .chip--local::before { content: "◆"; font-size: 10px; margin-inline-end: 7px; vertical-align: 1px; color: var(--tj-brand); }
  /* لقطة حقيقية من لقطات المتجر (01-overlay): إطار الفيديو وحده بالترجمة العربية فوق الإنجليزية. */
  .shot {
    flex: 0 0 540px; height: 226px; border-radius: 14px; overflow: hidden;
    background: url("{{ROOT}}/store/screenshots/chromium/01-overlay.png") no-repeat;
    background-size: 816.05px auto; background-position: -26.14px -177.87px;
    box-shadow: 0 0 0 1px var(--tj-border), 0 18px 40px -18px rgb(0 0 0 / 35%);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      {{LOGO:50}}
      <h1>ترجمتك العربية فوق الفيديو</h1>
      <p>نزّل الترجمة الإنجليزية، وترجمها بالنموذج الذي تختاره، ثم شاهدها بالعربية بتوقيتها. وكل شيء على جهازك.</p>
      <div class="chips">
        <span class="chip chip--local">المعالجة والحفظ محليان</span>
        <span class="chip" dir="ltr">Chrome · Edge · Brave · Firefox</span>
      </div>
    </div>
    <div class="shot" role="img" aria-label="لقطة حقيقية: ترجمة عربية فوق الإنجليزية على مشغّل يوتيوب"></div>
  </div>
</body>
</html>
