<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لقطة 02 — النافذة والزوج اللغوي</title>
<link rel="stylesheet" href="{{ROOT}}/src/ui/fonts.css">
<link rel="stylesheet" href="{{HERE}}/base.css">
<link rel="stylesheet" href="{{HERE}}/shot.css">
<style>
  :root { --h: {{H}}px; --band: {{BAND}}px; }
  /* SCREENSHOT 02 · POPUP · LANGUAGE PAIR. منطقة الواجهة #EAE5DA، والنافذة (340) يمينًا على بعد 72 و48، وبطاقة «ما يُنسخ» ورقائق الأزواج
     يسارًا على بعد 72 و60، كلها من اللوحة. والنافذة في اللوحة رسم، فحلّت محلها لقطة حقيقية للنافذة نفسها (07-popup) بعرضها الحقيقي
     وحافتها وظلها كما في اللوحة. وبطاقة «ما يُنسخ» والرقائق شرحٌ تسويقي لا واجهة، فبقيت كما رسمتها اللوحة. */
  .ui { background: #EAE5DA; }
  .pp { position: absolute; right: 72px; top: 48px; width: 340px; border: 1px solid #E2DDD2; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgb(24 46 43 / 16%); background: #FFFDF8; }
  .pp img { width: 340px; height: auto; }
  .side { position: absolute; left: 72px; top: 60px; width: 560px; display: flex; flex-direction: column; gap: 12px; direction: rtl; }
  .card { padding: 20px 24px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E2DDD2; font: 400 16px/26px "Tarjuman UI Almarai", sans-serif; color: #4A5A58; }
  .card b { color: #182E2B; font-family: "Tarjuman UI Cairo", sans-serif; font-weight: 700; }
  .chips { display: flex; gap: 10px; }
  .chip { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 999px; background: #DFD9CC; color: #4A5A58; font: 700 13px/18px "Tarjuman UI Almarai", sans-serif; direction: ltr; }
</style>
</head>
<body>
  <div class="shot">
    <div class="band"><h3>من أي لغة إلى لغتك</h3><p>اختر «من» و«إلى»، وانسخ تعليمات الترجمة لأي نموذج ذكاء اصطناعي تختاره.</p></div>
    <div class="ui">
      <div class="pp"><img class="real" src="{{SHOT:07-popup.png}}" alt=""></div>
      <div class="side">
        <div class="card"><b>ما يُنسخ:</b> تعليمات جاهزة للنموذج — اللغة المصدر، اللغة المطلوبة، الحفاظ على الترقيم والتوقيت، والمصطلحات من قاموسك.</div>
        <div class="chips"><span class="chip">EN → AR</span><span class="chip">JA → EN</span><span class="chip">ES → AR</span><span class="chip">FR → TR</span></div>
      </div>
    </div>
  </div>
</body>
</html>
