<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Marquee والبلاطة الكبيرة 1400×560</title>
<link rel="stylesheet" href="{{ROOT}}/src/ui/fonts.css">
<link rel="stylesheet" href="{{HERE}}/base.css">
<style>
  /* MARQUEE / LARGE TILE 1400×560 (Chrome وEdge)، لوحة 18 حرفيًا: عاج، والقفل (الرمز 88 بنقطتي طين والاسم Cairo 800 صنوبرًا)، والعنوان
     والسطر، وإطار المشغّل 600×400 بزاوية 14 وظله، ورقائق تحته. والمشغّل في اللوحة رسمٌ (تدرّج وسطرا ترجمة)، فحلّت محله لقطة حقيقية
     للمشغّل وعليه الترجمة فوق الأصل (01b-overlay-player)، مقصوصة بنسبة الإطار. ورقاقة «Chrome · Edge · Firefox» في اللوحة لا
     تُرسم: البلاطة تُرفع إلى Edge أيضًا، وسياسته (1.1.2) تمنع ذكر متصفح آخر في مواد الإدراج. */
  html, body { width: 1400px; height: 560px; }
  .mq { width: 1400px; height: 560px; background: #F3EFE6; position: relative; overflow: hidden; color: #182E2B; }
  .l { position: absolute; right: 88px; top: 112px; width: 560px; }
  .lock { display: flex; align-items: center; gap: 22px; }
  .lock svg { color: #1E4A44; }
  .lock .dots { color: #B9705A; }
  .lock b { font: 800 64px/72px "Tarjuman UI Cairo", sans-serif; color: #1E4A44; }
  h3 { margin: 40px 0 0; font: 800 44px/58px "Tarjuman UI Cairo", sans-serif; }
  p { margin: 14px 0 0; font: 400 20px/32px "Tarjuman UI Almarai", sans-serif; color: #4A5A58; }
  .shot { position: absolute; left: 72px; top: 88px; width: 600px; height: 400px; border-radius: 14px; overflow: hidden; background: #0F1917; box-shadow: 0 24px 60px rgb(24 46 43 / 28%); }
  /* القص بنسبة الإطار يُبقي 1215 من عرض اللقطة 1934: من بعد عدّاد الوقت إلى ما قبل الترس، فيظهر سطرا الترجمة كاملين وأزرار ترجمان
     وزر الترجمة، ولا يُقطع عنصر في طرفيه (القص من الوسط كان يقطع العدّاد في اليسار والترس في اليمين). */
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: 58% center; }
  .pill { position: absolute; left: 72px; bottom: 40px; display: flex; gap: 10px; }
  .pill span { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFDF8; border: 1px solid #E2DDD2; font: 700 15px/20px "Tarjuman UI Almarai", sans-serif; color: #182E2B; }
</style>
</head>
<body>
  <div class="mq">
    <div class="l">
      <div class="lock"><svg width="88" viewBox="0 0 200 176.4"><path class="dots" fill="currentColor" d="M50 0L100 50 50 100 0 50Z"/><path class="dots" fill="currentColor" d="M150 0L200 50 150 100 100 50Z"/><path fill="currentColor" d="M0 114.6H23.6C46.5 114.6 71 124.2 100 152.8C129 124.2 153.5 114.6 176.4 114.6H200V176.4H0Z"/></svg><b>ترجمان</b></div>
      <h3>اقرأ الفيديو بلغتك</h3>
      <p>احفظ ترجمة الفيديو، ترجمها بالنموذج الذي تختاره، ثم اعرضها فوق الفيديو بضبط التوقيت والتحرير. كل شيء على جهازك.</p>
    </div>
    <div class="shot"><img class="real" src="{{SHOT:01b-overlay-player.png}}" alt=""></div>
    <div class="pill"><span class="tm">for YouTube™</span><span>بلا حساب ولا مفتاح API</span></div>
  </div>
</body>
</html>
