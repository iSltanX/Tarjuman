<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>البلاطة الصغيرة 440×280</title>
<link rel="stylesheet" href="{{ROOT}}/src/ui/fonts.css">
<link rel="stylesheet" href="{{HERE}}/base.css">
<style>
  /* SMALL PROMO TILE 440×280 (Chrome وEdge)، لوحة 18 حرفيًا: صنوبر، والرمز العاجي بنقطتي طين 92، والعنوان Cairo 800، وسطر الرسالة، وشريط طيني. */
  html, body { width: 440px; height: 280px; }
  /* Chrome بلا نافذة لا يضيّق النافذة دون نحو 500 بكسل، فتُرسم الصفحة أعرض من 440 ويلتقط المخرج يسارها، والاتجاه من اليمين يدفع البلاطة
     إلى طرف النافذة الأيمن. فتُثبَّت في أعلى اليسار بلا اعتماد على عرض النافذة. */
  .promo { width: 440px; height: 280px; background: #1E4A44; color: #F3EFE6; position: absolute; left: 0; top: 0; overflow: hidden; }
  .mark { position: absolute; right: 36px; top: 36px; width: 92px; color: #F3EFE6; }
  .mark .dots { color: #D9937B; }
  h3 { position: absolute; right: 36px; top: 150px; margin: 0; font: 800 34px/42px "Tarjuman UI Cairo", sans-serif; }
  p { position: absolute; right: 36px; top: 200px; margin: 0; font: 400 15px/22px "Tarjuman UI Almarai", sans-serif; color: rgb(243 239 230 / 78%); }
  .strip { position: absolute; left: 0; bottom: 0; width: 100%; height: 6px; background: #B9705A; }
</style>
</head>
<body>
  <div class="promo">
    <svg class="mark" viewBox="0 0 200 176.4"><path class="dots" fill="currentColor" d="M50 0L100 50 50 100 0 50Z"/><path class="dots" fill="currentColor" d="M150 0L200 50 150 100 100 50Z"/><path fill="currentColor" d="M0 114.6H23.6C46.5 114.6 71 124.2 100 152.8C129 124.2 153.5 114.6 176.4 114.6H200V176.4H0Z"/></svg>
    <h3>ترجمتك فوق الفيديو</h3>
    <p>من أي لغة إلى لغتك · <bdi class="tm">for YouTube™</bdi></p>
    <div class="strip"></div>
  </div>
</body>
</html>
