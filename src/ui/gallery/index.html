<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ترجمان — معرض المكوّنات</title>
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    .g-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .g-swatch { border: 1px solid var(--tj-border); border-radius: 10px; overflow: hidden; font: 500 12px/18px var(--tj-font-mono); }
    .g-swatch span { display: block; height: 36px; }
    .g-swatch code { display: block; padding: 4px 8px; direction: ltr; text-align: left; color: var(--tj-text-2); }
    .g-section { display: flex; flex-direction: column; gap: 12px; }
    .g-dialog { position: static; display: block; }
    .g-toasts { position: static; align-items: flex-start; pointer-events: auto; }
    .g-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .g-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 6px; background: var(--tj-surface-2); color: var(--tj-text-2); }
    .g-icon code { font: 400 11px/16px var(--tj-font-mono); direction: ltr; color: var(--tj-muted); }
    .g-mark { color: var(--tj-logo-glyph); fill: currentColor; }
  </style>
</head>
<body class="tj-page">
  <main id="app"></main>
  <script src="gallery.js"></script>
</body>
</html>
